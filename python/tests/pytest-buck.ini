# Monarch's pytest settings, used instead of ../../pyproject.toml when these tests
# run on Remote Execution (see re_tests.bzl), which can't read that file.
# Keep in sync with [tool.pytest.ini_options] in ../../pyproject.toml.
[pytest]
markers =
    oss_skip: marks tests to skip in OSS CI
asyncio_mode = auto
# Default timeout of 5 minutes
timeout = 300
